[project]
name = "complydoc"
version = "0.1.0"
description = "Offline pre-purchase diagnostic for document automation: LLM cost estimate, extraction difficulty signals, and masked UK GDPR sensitive data scan."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Duarte Cardoso", email = "caldasdcardoso@gmail.com" }]
keywords = ["pdf", "ocr", "gdpr", "pii", "document-automation", "offline"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pillow>=10.3",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "tiktoken>=0.7",
    "py3langid>=0.4.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
ner = ["spacy>=3.7"]

[project.scripts]
complydoc = "complydoc.cli:app"

[project.urls]
Repository = "https://github.com/duartecaldascardoso/complydoc"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "reportlab>=4.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complydoc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pypdfium2.*", "rapidocr_onnxruntime.*", "spacy.*", "tiktoken.*", "docx.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "requires_ocr: needs the optional [ocr] extra installed",
    "requires_ner: needs the optional [ner] extra installed",
]
